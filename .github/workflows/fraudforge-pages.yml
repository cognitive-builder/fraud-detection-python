name: Deploy FraudForge documentation

on:
  push:
    branches: [main]
    paths:
      - "autodata-bian-fraudforge/docs/**"
      - "autodata-bian-fraudforge/mkdocs.yml"
      - "autodata-bian-fraudforge/requirements-docs.txt"
      - ".github/workflows/fraudforge-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fraudforge-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: autodata-bian-fraudforge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autodata-bian-fraudforge/requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: autodata-bian-fraudforge/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
