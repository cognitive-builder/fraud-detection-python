[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudforge-autodata"
version = "0.1.0"
description = "Agentic synthetic data for BIAN Fraud Evaluation, inspired by Autodata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Shashi Kumar Nagulakonda" }]
keywords = ["synthetic-data", "agents", "banking", "fraud", "BIAN", "Gradio"]
dependencies = [
  "fastapi>=0.115,<1",
  "gradio>=6.5,<7",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]
hub = ["huggingface-hub>=0.30,<2"]

[project.scripts]
fraudforge = "fraudforge.cli:main"

[tool.setuptools.packages.find]
include = ["fraudforge*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
